name: Weekly Google Scholar Citations

on:
  # One-time bootstrap for the user-requested refresh; removed after this run starts.
  push:
    branches: [main]
    paths: ['.github/workflows/google_scholar_weekly.yaml']
  schedule:
    # GitHub cron is UTC: Monday 00:00 UTC = Monday 08:00 Asia/Shanghai.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: google-scholar-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Fetch profile once
      run: |
        cd ./google_scholar_crawler
        python3 main.py
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'STze0QgAAAAJ' }}
    - name: Publish same-origin statistics
      run: |
        mkdir -p _data assets/data
        cp google_scholar_crawler/results/gs_data.json _data/google_scholar.json
        cp google_scholar_crawler/results/gs_data.json assets/data/google-scholar.json
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add _data/google_scholar.json assets/data/google-scholar.json
        if git diff --cached --quiet; then exit 0; fi
        git commit -m 'Update weekly Google Scholar statistics'
        git pull --rebase origin main
        git push origin HEAD:main
    - name: Request website rebuild
      run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
