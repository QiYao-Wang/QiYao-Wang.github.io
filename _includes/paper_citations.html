{%- assign scholar_paper = site.data.google_scholar.publications[include.id] -%}
<a class="paper-citation-badge"{% if include.id %} data-scholar-id="{{ include.id }}"{% endif %} href="https://scholar.google.com/citations?user={{ site.data.google_scholar.scholar_id }}{% if include.id %}&amp;view_op=view_citation&amp;citation_for_view={{ include.id | url_encode }}{% endif %}" title="Google Scholar citations · {% if scholar_paper %}updated {{ site.data.google_scholar.updated | slice: 0, 10 }}{% else %}not yet available{% endif %}"><span>GS Citations</span><strong class="paper-citation-count">{{ scholar_paper.num_citations | default: '—' }}</strong></a>
